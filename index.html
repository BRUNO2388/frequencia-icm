<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Frequência de Cultos - ICM PINHOS</title>

  <!-- CONFIGURAÇÕES DE PWA / TELA CHEIA -->
  <meta name="theme-color" content="#2d6a4f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ICM PINHOS">
  <meta name="application-name" content="ICM PINHOS">

  <!-- ÍCONE DO APP EM SVG (PREVINE ÍCONE "G" DO GITHUB) -->
 <link rel="manifest" href="manifest.json">
  
  <!-- BIBLIOTECAS DE CAPTURA E PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Playfair+Display:ital,wght@1,600;1,800&display=swap');


  /* =========================================================
     VARIÁVEIS - TEMA CLARO
  ========================================================= */

  :root {
    --bg-body: #f3f6f9;
    --bg-container: #ffffff;

    --text-main: #263238;
    --text-secondary: #607d8b;
    --text-muted: #78909c;

    --border-color: #d9e0e6;
    --border-light: #e8edf1;

    --card-bg: #f7f9fb;

    /* Identidade */
    --primary: #2d6a4f;
    --primary-hover: #1f513b;

    --secondary: #1c3d5a;
    --secondary-light: #4f789c;

    /* Inputs */
    --input-bg: #ffffff;
    --input-border: #cbd5df;
    --input-focus: #4f789c;

    /* Logo */
    --logo-box-bg: #eaf1f8;
    --logo-box-border: #d2dfeb;

    /* Status positivo */
    --success-bg: #e8f5e9;
    --success-text: #1b5e20;
    --success-border: #81c784;

    /* Erro */
    --danger-bg: #ffebee;
    --danger-text: #b71c1c;
    --danger-border: #ef9a9a;

    /* Aviso */
    --warning-bg: #fff8e1;
    --warning-text: #795548;
    --warning-border: #d6b85c;

    /* Sombras */
    --shadow: rgba(0, 0, 0, 0.12);

    /* Relatórios */
    --report-bg: #ffffff;
    --report-text: #333333;
  }


  /* =========================================================
     VARIÁVEIS - TEMA ESCURO
  ========================================================= */

  body.dark-mode {
    --bg-body: #0f1419;
    --bg-container: #171d23;

    --text-main: #e8edf2;
    --text-secondary: #aeb8c2;
    --text-muted: #81909d;

    --border-color: #303a45;
    --border-light: #252e37;

    --card-bg: #202830;

    /* Identidade */
    --primary: #4caf7d;
    --primary-hover: #3d9868;

    --secondary: #7eb6e6;
    --secondary-light: #9bc7eb;

    /* Inputs */
    --input-bg: #1d252d;
    --input-border: #3a4652;
    --input-focus: #7eb6e6;

    /* Logo */
    --logo-box-bg: #1b2733;
    --logo-box-border: #34485c;

    /* Status positivo */
    --success-bg: #173a29;
    --success-text: #8ee0ad;
    --success-border: #3d8f62;

    /* Erro */
    --danger-bg: #3b1e23;
    --danger-text: #ff9ca7;
    --danger-border: #9e4a54;

    /* Aviso */
    --warning-bg: #3a301b;
    --warning-text: #ffe08a;
    --warning-border: #8c7635;

    /* Sombras */
    --shadow: rgba(0, 0, 0, 0.40);

    /* Relatórios continuam como folha */
    --report-bg: #ffffff;
    --report-text: #333333;
  }


  /* =========================================================
     RESET
  ========================================================= */

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;

    font-family:
      'Segoe UI',
      Tahoma,
      Geneva,
      Verdana,
      sans-serif;
  }


  /* =========================================================
     BODY
  ========================================================= */

  body {
    background-color: var(--bg-body);
    color: var(--text-main);

    padding: 15px;

    display: flex;
    flex-direction: column;
    align-items: center;

    transition:
      background-color 0.3s ease,
      color 0.3s ease;
  }


  /* =========================================================
     CONTAINER PRINCIPAL
  ========================================================= */

  .container {
    width: 100%;
    max-width: 680px;

    background: var(--bg-container);

    padding: 20px;

    border-radius: 12px;

    box-shadow:
      0 4px 18px var(--shadow);

    position: relative;

    transition:
      background-color 0.3s ease,
      box-shadow 0.3s ease;
  }


  /* =========================================================
     BOTÃO MODO ESCURO / CLARO
  ========================================================= */

  .theme-toggle-btn {
    position: absolute;
    top: 15px;
    right: 15px;

    background: var(--card-bg);

    border: 1px solid var(--border-color);

    color: var(--text-main);

    padding: 6px 12px;

    border-radius: 20px;

    font-size: 0.85rem;
    font-weight: bold;

    cursor: pointer;

    display: flex;
    align-items: center;
    gap: 6px;

    z-index: 10;

    transition: all 0.2s ease;
  }

  .theme-toggle-btn:hover {
    background: var(--primary);
    color: #ffffff;
    border-color: var(--primary);

    transform: translateY(-1px);
  }


  /* =========================================================
     STATUS DA INTERNET
  ========================================================= */

  .net-status-bar {
    width: 100%;
    max-width: 680px;

    padding: 8px 12px;

    border-radius: 8px;

    margin-bottom: 12px;

    font-size: 0.85rem;
    font-weight: bold;

    text-align: center;

    display: flex;
    justify-content: center;
    align-items: center;

    gap: 8px;
  }

  .net-status-bar.online {
    background: var(--success-bg);
    color: var(--success-text);
    border: 1px solid var(--success-border);
  }

  .net-status-bar.offline {
    background: var(--warning-bg);
    color: var(--warning-text);
    border: 1px solid var(--warning-border);
  }


  /* =========================================================
     CABEÇALHO / LOGO
  ========================================================= */

  .logo-box {
    background: linear-gradient(
      135deg,
      #5b8fc4 0%,
      #315f8c 100%
    );

    border: 1px solid #6f9dcc;

    border-radius: 12px;

    padding: 20px 15px;

    text-align: center;

    margin-bottom: 20px;

    box-shadow:
      0 4px 15px rgba(0, 0, 0, 0.15);

    color: #ffffff;

    transition:
      background 0.3s ease,
      box-shadow 0.3s ease;
  }


  /* Cabeçalho no modo escuro */

  body.dark-mode .logo-box {
    background: linear-gradient(
      135deg,
      #243b53 0%,
      #142536 100%
    );

    border-color: #38566f;

    box-shadow:
      0 5px 20px rgba(0, 0, 0, 0.45),
      inset 0 1px 0 rgba(255, 255, 255, 0.04);
  }


  .logo-img-container {
    max-width: 260px;

    margin: 0 auto 10px auto;
  }

  .logo-img-container img {
    width: 100%;
    height: auto;

    border-radius: 8px;

    display: block;
  }


  .subtitulo-pinhos {
    font-family:
      'Playfair Display',
      Georgia,
      serif;

    font-size: 1.6rem;

    font-weight: 800;

    letter-spacing: 3px;

    color: #ffffff;

    margin-top: 5px;

    text-transform: uppercase;
  }


  .tag-frequencia {
    display: inline-block;

    background-color: #ffffff;

    color: #1c3d5a;

    font-size: 0.85rem;

    font-weight: 800;

    padding: 4px 12px;

    border-radius: 20px;

    margin-top: 8px;

    letter-spacing: 1px;

    text-transform: uppercase;
  }

  body.dark-mode .tag-frequencia {
    background: #e8eef4;
    color: #20384d;
  }


  /* =========================================================
     NAVEGAÇÃO / ABAS
  ========================================================= */

  .nav-tabs {
    display: flex;

    gap: 4px;

    margin-bottom: 20px;

    border-bottom: 2px solid var(--primary);

    overflow-x: auto;

    -webkit-overflow-scrolling: touch;
  }


  .tab-btn {
    flex: 1;

    padding: 10px 6px;

    border: none;

    background: var(--card-bg);

    cursor: pointer;

    font-weight: bold;

    font-size: 0.8rem;

    border-radius: 6px 6px 0 0;

    color: var(--text-main);

    white-space: nowrap;

    transition: all 0.2s ease;
  }


  .tab-btn:hover {
    background: var(--border-light);
  }


  .tab-btn.active {
    background: var(--primary);
    color: #ffffff;
  }


  .tab-content {
    display: none;
  }

  .tab-content.active {
    display: block;
  }


  /* =========================================================
     TÍTULOS
  ========================================================= */

  h2 {
    font-size: 1rem;

    color: var(--secondary);

    border-bottom: 2px solid var(--secondary);

    padding-bottom: 5px;

    margin: 15px 0;

    text-align: center;

    font-weight: 800;
  }


  label {
    font-size: 0.85rem;

    font-weight: 800;

    color: var(--secondary);

    display: block;

    margin: 8px 0 4px;
  }


  /* =========================================================
     INPUTS / SELECT
  ========================================================= */

  input,
  select {
    width: 100%;

    padding: 10px;

    border: 1px solid var(--input-border);

    background: var(--input-bg);

    color: var(--text-main);

    border-radius: 8px;

    font-size: 0.95rem;

    outline: none;

    transition:
      border-color 0.2s ease,
      box-shadow 0.2s ease,
      background 0.2s ease;
  }


  input::placeholder {
    color: var(--text-muted);
  }


  input:focus,
  select:focus {
    border-color: var(--input-focus);

    box-shadow:
      0 0 0 3px rgba(76, 175, 125, 0.15);
  }


  /* =========================================================
     GRIDS
  ========================================================= */

  .grid-2 {
    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 10px;
  }


  .grid-3 {
    display: grid;

    grid-template-columns:
      1fr 1fr 1fr;

    gap: 10px;
  }


  /* =========================================================
     BOTÃO PRINCIPAL
  ========================================================= */

  button.btn-main {
    width: 100%;

    padding: 12px;

    border: none;

    border-radius: 8px;

    font-weight: bold;

    cursor: pointer;

    background-color: var(--primary);

    color: #ffffff;

    font-size: 0.95rem;

    margin-top: 8px;

    transition:
      background-color 0.2s ease,
      transform 0.2s ease;
  }


  button.btn-main:hover {
    background-color: var(--primary-hover);

    transform: translateY(-1px);
  }


  /* =========================================================
     BOTÕES DE EXPORTAÇÃO
  ========================================================= */

  .btn-wsp {
    background-color: #25d366 !important;
    color: #ffffff !important;
  }


  .btn-img {
    background-color: #007bff !important;
    color: #ffffff !important;
  }


  .btn-pdf {
    background-color: #dc3545 !important;
    color: #ffffff !important;
  }


  .btn-csv {
    background-color: #17a2b8 !important;
    color: #ffffff !important;
  }


  /* =========================================================
     BOTÃO PEQUENO SECUNDÁRIO
  ========================================================= */

  .btn-small-sec {
    background: var(--card-bg);

    border: 1px solid var(--border-color);

    padding: 6px 10px;

    font-size: 0.78rem;

    font-weight: bold;

    border-radius: 6px;

    cursor: pointer;

    color: var(--text-main);

    transition: all 0.2s ease;
  }


  .btn-small-sec:hover {
    background: var(--primary);

    color: #ffffff;

    border-color: var(--primary);
  }


  /* =========================================================
     PESQUISA
  ========================================================= */

  .search-box {
    margin-bottom: 12px;

    position: relative;
  }


  .search-results {
    background: var(--bg-container);

    border: 1px solid var(--primary);

    border-radius: 8px;

    max-height: 200px;

    overflow-y: auto;

    margin-top: 4px;

    display: none;

    box-shadow:
      0 4px 12px var(--shadow);
  }


  .search-result-item {
    padding: 10px;

    display: flex;

    justify-content: space-between;

    align-items: center;

    border-bottom:
      1px solid var(--border-color);

    cursor: pointer;

    transition: background 0.2s ease;
  }


  .search-result-item:hover {
    background: var(--card-bg);
  }


  /* =========================================================
     MEMBROS
  ========================================================= */

  .member-select-item {
    display: flex;

    justify-content: space-between;

    align-items: center;

    padding: 10px;

    background: var(--card-bg);

    border: 1px solid var(--border-color);

    border-radius: 6px;

    margin-bottom: 6px;
  }


  .member-info {
    display: flex;

    flex-direction: column;
  }


  .member-tag {
    font-size: 0.75rem;

    color: var(--text-secondary);

    margin-top: 2px;
  }


  /* =========================================================
     STATUS DO MEMBRO
  ========================================================= */

  .status-badge-btn {
    padding: 6px 14px;

    border-radius: 20px;

    border: 1px solid var(--border-color);

    background: var(--bg-container);

    color: var(--text-main);

    cursor: pointer;

    font-size: 0.85rem;

    font-weight: bold;

    min-width: 90px;

    text-align: center;

    transition: all 0.2s ease;
  }


  .status-badge-btn.presente {
    background: var(--success-bg);

    color: var(--success-text);

    border-color: var(--success-border);
  }


  /* =========================================================
     GERENCIAMENTO DE MEMBROS
  ========================================================= */

  .member-manage-item {
    display: flex;

    justify-content: space-between;

    align-items: center;

    padding: 10px 8px;

    border-bottom:
      1px solid var(--border-color);

    gap: 10px;
  }


  .member-manage-info {
    display: flex;

    flex-direction: column;

    flex: 1;

    min-width: 0;
  }


  .member-manage-name {
    font-size: 0.92rem;

    font-weight: 700;

    word-break: break-word;

    line-height: 1.25;
  }


  .member-manage-group {
    font-size: 0.78rem;

    color: var(--text-secondary);

    margin-top: 3px;
  }


  .member-manage-actions {
    display: flex;

    align-items: center;

    gap: 8px;

    flex-shrink: 0;
  }


  .member-action-btn {
    border: none;

    background: none;

    cursor: pointer;

    font-size: 0.82rem;

    font-weight: 600;

    padding: 4px 6px;

    border-radius: 4px;
  }


  .member-action-btn.edit {
    color: #42a5f5;
  }


  .member-action-btn.delete {
    color: #ef5350;
  }


  /* =========================================================
     VISITANTES
  ========================================================= */

  .visitor-chip {
    display: inline-flex;

    align-items: center;

    gap: 8px;

    background: var(--success-bg);

    border: 1px solid var(--success-border);

    padding: 6px 12px;

    border-radius: 20px;

    font-size: 0.85rem;

    font-weight: bold;

    color: var(--success-text);
  }


  .visitor-chip button {
    background: none;

    border: none;

    color: var(--danger-text);

    font-weight: bold;

    cursor: pointer;

    font-size: 0.9rem;
  }


  /* =========================================================
     CONTADOR FLUTUANTE
  ========================================================= */

  .floating-counter {
    position: fixed;

    bottom: 20px;

    right: 20px;

    background: var(--primary);

    color: #ffffff;

    padding: 12px 18px;

    border-radius: 30px;

    font-weight: bold;

    font-size: 0.95rem;

    box-shadow:
      0 4px 15px rgba(0, 0, 0, 0.3);

    z-index: 9999;

    display: flex;

    align-items: center;

    gap: 8px;

    border: 2px solid var(--bg-container);
  }


  /* =========================================================
     PÓDIO
  ========================================================= */

  .podium-box {
    display: grid;

    grid-template-columns:
      1fr 1fr 1fr;

    gap: 8px;

    margin-bottom: 15px;

    text-align: center;
  }


  .podium-card {
    background: var(--card-bg);

    border: 1px solid var(--border-color);

    padding: 12px 6px;

    border-radius: 8px;
  }


  .podium-card.first {
    background: var(--warning-bg);

    color: var(--text-main);

    border-color: var(--warning-border);
  }


  .podium-card.second {
    background: var(--card-bg);
  }


  .podium-card.third {
    background: var(--card-bg);
  }


  .podium-number {
    font-size: 1.8rem;

    font-weight: 900;

    line-height: 1;

    color: var(--primary);
  }


  .podium-card.first .podium-number {
    color: var(--warning-text);
  }


  .podium-name {
    font-size: 0.9rem;

    font-weight: 700;

    margin-top: 4px;
  }


  .podium-count {
    font-size: 0.8rem;

    color: var(--text-muted);

    margin-top: 2px;
  }


  /* =========================================================
     RELATÓRIO
  ========================================================= */

  .report-section {
    margin-bottom: 15px;
  }


  .report-table {
    width: 100%;

    border-collapse: collapse;
  }


  .report-table th,
  .report-table td {
    padding: 10px;

    text-align: left;

    border-bottom: 1px solid var(--border-color);

    font-size: 0.9rem;
  }


  .report-table th {
    background: var(--card-bg);

    font-weight: bold;

    color: var(--secondary);
  }


  .report-table tr:hover {
    background: var(--card-bg);
  }


  /* =========================================================
     MEDIA QUERIES
  ========================================================= */

  @media (max-width: 600px) {
    .container {
      padding: 15px;

      border-radius: 8px;
    }

    .logo-img-container {
      max-width: 180px;
    }

    .subtitulo-pinhos {
      font-size: 1.3rem;

      letter-spacing: 2px;
    }

    .tag-frequencia {
      font-size: 0.75rem;

      padding: 3px 10px;
    }

    .nav-tabs {
      gap: 2px;
    }

    .tab-btn {
      font-size: 0.7rem;

      padding: 8px 4px;
    }

    h2 {
      font-size: 0.9rem;

      margin: 12px 0;
    }

    .grid-2,
    .grid-3 {
      grid-template-columns: 1fr;

      gap: 8px;
    }

    .floating-counter {
      bottom: 15px;

      right: 15px;

      font-size: 0.85rem;

      padding: 10px 14px;
    }

    .podium-number {
      font-size: 1.4rem;
    }
  }

</style>

</head>
<body>

  <!-- Status de Conexão -->
  <div class="net-status-bar online">
    🟢 Conectado
  </div>

  <div class="container">

    <!-- Botão Tema Escuro/Claro -->
    <button class="theme-toggle-btn" id="themeToggle">🌙</button>

    <!-- Cabeçalho -->
    <div class="logo-box">
      <div class="logo-img-container">
        <img src="logo.jpg.jpg" alt="Logo ICM PINHOS" loading="lazy">
      </div>
      <div class="subtitulo-pinhos">ICM PINHOS</div>
      <span class="tag-frequencia">Frequência</span>
    </div>

    <!-- Navegação -->
    <div class="nav-tabs">
      <button class="tab-btn active" onclick="switchTab(0)">📍 Frequência</button>
      <button class="tab-btn" onclick="switchTab(1)">👥 Membros</button>
      <button class="tab-btn" onclick="switchTab(2)">📊 Relatório</button>
    </div>

    <!-- ABA 1: FREQUÊNCIA -->
    <div class="tab-content active" id="tab-0">
      <h2>Registrar Frequência</h2>

      <label>Data do Culto</label>
      <input type="date" id="cultDate" required>

      <label>Tipo de Culto</label>
      <select id="cultType">
        <option>Culto Matinal</option>
        <option>Culto Noturno</option>
        <option>Estudo Bíblico</option>
      </select>

      <label>Selecione os Membros Presentes</label>
      <div id="membersList"></div>

      <label>Visitantes (nomes separados por vírgula)</label>
      <input type="text" id="visitantes" placeholder="Ex: Maria Silva, João Santos">

      <button class="btn-main" onclick="salvarFrequencia()">💾 Salvar Frequência</button>
    </div>

    <!-- ABA 2: MEMBROS -->
    <div class="tab-content" id="tab-1">
      <h2>Gerenciar Membros</h2>

      <label>Nome do Novo Membro</label>
      <input type="text" id="newMemberName" placeholder="Digite o nome completo">

      <label>Grupo</label>
      <select id="newMemberGroup">
        <option>Geral</option>
        <option>Jovens</option>
        <option>Adolescentes</option>
        <option>Crianças</option>
      </select>

      <button class="btn-main" onclick="adicionarMembro()">➕ Adicionar Membro</button>

      <h2 style="margin-top: 20px;">Membros Cadastrados</h2>
      <div id="membersList2"></div>
    </div>

    <!-- ABA 3: RELATÓRIO -->
    <div class="tab-content" id="tab-2">
      <h2>Estatísticas de Frequência</h2>

      <div class="podium-box">
        <div class="podium-card first">
          <div class="podium-number">🥇</div>
          <div class="podium-name" id="top1Name">-</div>
          <div class="podium-count" id="top1Count">0 presenças</div>
        </div>
        <div class="podium-card second">
          <div class="podium-number">🥈</div>
          <div class="podium-name" id="top2Name">-</div>
          <div class="podium-count" id="top2Count">0 presenças</div>
        </div>
        <div class="podium-card third">
          <div class="podium-number">🥉</div>
          <div class="podium-name" id="top3Name">-</div>
          <div class="podium-count" id="top3Count">0 presenças</div>
        </div>
      </div>

      <div class="grid-2">
        <button class="btn-main btn-pdf" onclick="exportarPDF()">📄 PDF</button>
        <button class="btn-main btn-csv" onclick="exportarCSV()">📊 CSV</button>
      </div>

      <div class="grid-2">
        <button class="btn-main btn-img" onclick="exportarImagem()">🖼️ Imagem</button>
        <button class="btn-main btn-wsp" onclick="exportarWhatsApp()">💬 WhatsApp</button>
      </div>

      <button class="btn-main" style="background-color: #ff6b6b; margin-top: 15px;" onclick="limparTodos()">🗑️ Limpar Tudo</button>
    </div>

  </div>

  <!-- Contador Flutuante -->
  <div class="floating-counter" id="floatingCounter">
    👥 Total: 0
  </div>

  <script>

    // ====== INICIALIZAÇÃO ======
    document.addEventListener('DOMContentLoaded', () => {
      carregarDados();
      atualizarUI();
    });

    // ====== TEMA ESCURO/CLARO ======
    document.getElementById('themeToggle').addEventListener('click', () => {
      document.body.classList.toggle('dark-mode');
      const isDark = document.body.classList.contains('dark-mode');
      localStorage.setItem('dark_mode', isDark);
      document.getElementById('themeToggle').textContent = isDark ? '☀️' : '🌙';
    });

    // Carregar tema salvo
    if (localStorage.getItem('dark_mode') === 'true') {
      document.body.classList.add('dark-mode');
      document.getElementById('themeToggle').textContent = '☀️';
    }

    // ====== NAVEGAÇÃO DE ABAS ======
    function switchTab(index) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      
      document.getElementById(`tab-${index}`).classList.add('active');
      document.querySelectorAll('.tab-btn')[index].classList.add('active');
    }

    // ====== CARREGAR DADOS ======
    function carregarDados() {
      try {
        const membros = JSON.parse(localStorage.getItem('membros')) || [];
        const frequencias = JSON.parse(localStorage.getItem('frequencias')) || [];
        
        renderizarMembros(membros);
        atualizarEstatisticas(membros, frequencias);
      } catch (error) {
        console.error('Erro ao carregar dados:', error);
      }
    }

    // ====== ADICIONAR MEMBRO ======
    function adicionarMembro() {
      try {
        const nome = document.getElementById('newMemberName').value.trim();
        const grupo = document.getElementById('newMemberGroup').value;

        if (nome.length < 2) {
          alert('⚠️ Nome deve ter pelo menos 2 caracteres!');
          return;
        }

        const membros = JSON.parse(localStorage.getItem('membros')) || [];
        
        if (membros.some(m => m.nome.toLowerCase() === nome.toLowerCase())) {
          alert('⚠️ Este membro já existe!');
          return;
        }

        membros.push({
          id: Date.now(),
          nome: nome,
          grupo: grupo,
          dataCriacao: new Date().toISOString()
        });

        localStorage.setItem('membros', JSON.stringify(membros));
        document.getElementById('newMemberName').value = '';
        
        carregarDados();
        alert('✅ Membro adicionado com sucesso!');
      } catch (error) {
        alert(`❌ Erro: ${error.message}`);
      }
    }

    // ====== SALVAR FREQUÊNCIA ======
    function salvarFrequencia() {
      try {
        const data = document.getElementById('cultDate').value;
        const tipo = document.getElementById('cultType').value;
        
        if (!data) {
          alert('⚠️ Selecione uma data!');
          return;
        }

        const checkboxes = document.querySelectorAll('#membersList input[type="checkbox"]:checked');
        const presentes = Array.from(checkboxes).map(cb => parseInt(cb.value));

        if (presentes.length === 0) {
          alert('⚠️ Selecione pelo menos um membro presente!');
          return;
        }

        const frequencias = JSON.parse(localStorage.getItem('frequencias')) || [];
        frequencias.push({
          data: data,
          tipo: tipo,
          presentes: presentes,
          visitantes: document.getElementById('visitantes').value,
          dataCriacao: new Date().toISOString()
        });

        localStorage.setItem('frequencias', JSON.stringify(frequencias));
        
        document.getElementById('cultDate').value = '';
        document.getElementById('visitantes').value = '';
        document.querySelectorAll('#membersList input[type="checkbox"]').forEach(cb => cb.checked = false);

        carregarDados();
        alert('✅ Frequência registrada com sucesso!');
      } catch (error) {
        console.error('Erro:', error);
      }
    }

    // ====== RENDERIZAR MEMBROS ======
    function renderizarMembros(membros) {
      const lista1 = document.getElementById('membersList');
      const lista2 = document.getElementById('membersList2');
      
      lista1.innerHTML = '';
      lista2.innerHTML = '';

      membros.forEach(membro => {
        // Lista de seleção (ABA 1)
        const item1 = document.createElement('div');
        item1.className = 'member-select-item';
        item1.innerHTML = `
          <label class="member-info">
            <input type="checkbox" value="${membro.id}" style="margin-right: 10px;">
            <span class="member-manage-name">${membro.nome}</span>
            <span class="member-tag">${membro.grupo}</span>
          </label>
        `;
        lista1.appendChild(item1);

        // Lista de gerenciamento (ABA 2)
        const item2 = document.createElement('div');
        item2.className = 'member-manage-item';
        item2.innerHTML = `
          <div class="member-manage-info">
            <div class="member-manage-name">${membro.nome}</div>
            <div class="member-manage-group">${membro.grupo}</div>
          </div>
          <div class="member-manage-actions">
            <button class="member-action-btn edit" onclick="editarMembro(${membro.id})">✏️</button>
            <button class="member-action-btn delete" onclick="deletarMembro(${membro.id})">🗑️</button>
          </div>
        `;
        lista2.appendChild(item2);
      });
    }

    // ====== DELETAR MEMBRO ======
    function deletarMembro(id) {
      if (confirm('⚠️ Tem certeza que deseja deletar este membro?')) {
        let membros = JSON.parse(localStorage.getItem('membros')) || [];
        membros = membros.filter(m => m.id !== id);
        localStorage.setItem('membros', JSON.stringify(membros));
        carregarDados();
        alert('✅ Membro deletado!');
      }
    }

    // ====== ATUALIZAR ESTATÍSTICAS ======
    function atualizarEstatisticas(membros, frequencias) {
      const contagem = {};
      
      frequencias.forEach(freq => {
        freq.presentes.forEach(id => {
          contagem[id] = (contagem[id] || 0) + 1;
        });
      });

      const ranking = membros
        .map(m => ({ ...m, presenças: contagem[m.id] || 0 }))
        .sort((a, b) => b.presenças - a.presenças)
        .slice(0, 3);

      for (let i = 0; i < 3; i++) {
        const top = ranking[i];
        document.getElementById(`top${i+1}Name`).textContent = top ? top.nome : '-';
        document.getElementById(`top${i+1}Count`).textContent = top ? `${top.presenças} presenças` : '0 presenças';
      }

      const total = membros.reduce((acc, m) => acc + (contagem[m.id] || 0), 0);
      document.getElementById('floatingCounter').textContent = `👥 Total: ${total}`;
    }

    // ====== EXPORTAR PDF ======
    function exportarPDF() {
      if (!confirm('📄 Deseja exportar em PDF?\n\nCertifique-se de compartilhar apenas com pessoas autorizadas!')) {
        return;
      }

      try {
        const element = document.querySelector('.container');
        const opt = {
          margin: 10,
          filename: 'frequencia_' + new Date().toISOString().split('T')[0] + '.pdf',
          image: { type: 'jpeg', quality: 0.98 },
          html2canvas: { scale: 2 },
          jsPDF: { orientation: 'portrait', unit: 'mm', format: 'a4' }
        };
        
        html2pdf().set(opt).from(element).save();
      } catch (error) {
        alert('❌ Erro ao exportar PDF: ' + error.message);
      }
    }

    // ====== EXPORTAR CSV ======
    function exportarCSV() {
      if (!confirm('📊 Deseja exportar em CSV?\n\nCertifique-se de compartilhar apenas com pessoas autorizadas!')) {
        return;
      }

      try {
        const membros = JSON.parse(localStorage.getItem('membros')) || [];
        const frequencias = JSON.parse(localStorage.getItem('frequencias')) || [];
        
        let csv = 'Data,Tipo,Presentes\n';
        
        frequencias.forEach(freq => {
          const nomes = freq.presentes
            .map(id => {
              const m = membros.find(mb => mb.id === id);
              return m ? m.nome : 'Desconhecido';
            })
            .join(';');
          
          csv += `"${freq.data}","${freq.tipo}","${nomes}"\n`;
        });

        const blob = new Blob([csv], { type: 'text/csv' });
        const url = window.URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = 'frequencia_' + new Date().toISOString().split('T')[0] + '.csv';
        link.click();
      } catch (error) {
        alert('❌ Erro ao exportar CSV: ' + error.message);
      }
    }

    // ====== EXPORTAR IMAGEM ======
    function exportarImagem() {
      if (!confirm('🖼️ Deseja capturar uma imagem?\n\nCertifique-se de compartilhar apenas com pessoas autorizadas!')) {
        return;
      }

      try {
        const element = document.querySelector('.container');
        html2canvas(element).then(canvas => {
          const link = document.createElement('a');
          link.href = canvas.toDataURL();
          link.download = 'frequencia_' + new Date().toISOString().split('T')[0] + '.png';
          link.click();
        });
      } catch (error) {
        alert('❌ Erro ao exportar imagem: ' + error.message);
      }
    }

    // ====== EXPORTAR WHATSAPP ======
    function exportarWhatsApp() {
      if (!confirm('💬 Deseja compartilhar no WhatsApp?\n\nCompartilhe apenas com pessoas autorizadas!')) {
        return;
      }

      try {
        const membros = JSON.parse(localStorage.getItem('membros')) || [];
        const frequencias = JSON.parse(localStorage.getItem('frequencias')) || [];
        
        const ultima = frequencias[frequencias.length - 1];
        if (!ultima) {
          alert('⚠️ Nenhuma frequência registrada!');
          return;
        }

        const nomes = ultima.presentes
          .map(id => {
            const m = membros.find(mb => mb.id === id);
            return m ? m.nome : 'Desconhecido';
          })
          .join('\n• ');

        const mensagem = `📋 *Frequência - ${ultima.data}*\n\n*Tipo:* ${ultima.tipo}\n\n*Presentes:*\n• ${nomes}\n\n_Gerado por ICM PINHOS_`;
        const encoded = encodeURIComponent(mensagem);
        
        window.open(`https://wa.me/?text=${encoded}`, '_blank');
      } catch (error) {
        alert('❌ Erro ao exportar WhatsApp: ' + error.message);
      }
    }

    // ====== LIMPAR TUDO ======
    function limparTodos() {
      if (confirm('⚠️ ATENÇÃO: Isso deletará TODOS os dados!\n\nTem certeza?')) {
        if (confirm('⛔ Última confirmação: Dados não podem ser recuperados!')) {
          localStorage.clear();
          carregarDados();
          alert('✅ Todos os dados foram removidos!');
        }
      }
    }

    // ====== ATUALIZAR UI ======
    function atualizarUI() {
      carregarDados();
    }

  </script>

</body>
</html>
