name: Run Organiza GL V17

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-organiza-gl-v17.yml'

permissions:
  contents: write

jobs:
  patch-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: organiza-gl-v17
          fetch-depth: 0

      - name: Aplicar organização do Grupo de Louvor
        run: python tools/patch_subabas_gl_v17.py

      - name: Validar alteração
        run: |
          git diff --check
          test "$(git diff --name-only)" = "index.html"
          grep -q 'data-gl-view="chamada"' index.html
          grep -q 'data-gl-view="integrantes"' index.html
          grep -q 'data-gl-view="historico"' index.html
          grep -q 'id="gl-view-chamada" class="gl-view active"' index.html
          grep -q 'id="gl-view-integrantes" class="gl-view"' index.html
          grep -q 'id="gl-view-historico" class="gl-view"' index.html
          grep -q "function glAlternarTela(nome)" index.html
          grep -q "glAlternarTela('chamada')" index.html
          node - <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const classic = /<script(?![^>]*\bsrc=)(?![^>]*\btype=["']module["'])[^>]*>([\s\S]*?)<\/script>/gi;
          let m, count = 0;
          while ((m = classic.exec(html))) { count++; new Function(m[1]); }
          if (!count) throw new Error('Nenhum script clássico encontrado');
          const moduleRe = /<script[^>]*\btype=["']module["'][^>]*>([\s\S]*?)<\/script>/gi;
          while ((m = moduleRe.exec(html))) {
            const cleaned = m[1].replace(/^\s*import\s+.*?;\s*$/gm, '');
            new Function(cleaned);
          }
          NODE

      - name: Commit e push na branch de teste
        run: |
          git config user.name 'github-actions-bot'
          git config user.email 'github-actions-bot@users.noreply.github.com'
          git add index.html
          git commit -m 'Organiza Grupo de Louvor em Chamada Integrantes e Historico'
          git push origin HEAD:organiza-gl-v17
