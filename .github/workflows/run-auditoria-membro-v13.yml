name: Run Auditoria Membro V13

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-auditoria-membro-v13.yml'

permissions:
  contents: write

jobs:
  patch-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: auditoria-membro-v13
          fetch-depth: 0

      - name: Aplicar correções auditadas
        run: python tools/patch_auditoria_membro_v13.py

      - name: Validar alterações
        run: |
          git diff --check
          test "$(git diff --name-only)" = "index.html"
          python - <<'PY'
          from pathlib import Path
          s = Path('index.html').read_text(encoding='utf-8')
          checks = [
              "const espelhoValido = !!(",
              "window.cultoAtual = {};",
              "Firebase pode omitir \"registro\" quando ele é um objeto vazio.",
              "const espelhoDoCultoSelecionado = !!(",
              "filtroListaAtual === 'PRESENTES' && totalP === 0",
              "origem: window.isAdmin ? 'admin' : 'membro'",
              "const origemItem = item.origem || 'membro';",
              "timeZone: 'America/Sao_Paulo'"
          ]
          for item in checks:
              assert item in s, item
          assert "atual.chave && atual.registro && atual.data === hojeMembro" not in s
          assert "window.registrosCultos[chave] || window.cultoAtual?.registro || {}" not in s
          assert "if (totalP === 0 && visitantesLista.length === 0)" not in s
          PY
          node - <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const classic = /<script(?![^>]*\bsrc=)(?![^>]*\btype=["']module["'])[^>]*>([\s\S]*?)<\/script>/gi;
          let m, count = 0;
          while ((m = classic.exec(html))) { count++; new Function(m[1]); }
          if (!count) throw new Error('Nenhum script clássico encontrado');
          const moduleRe = /<script[^>]*\btype=["']module["'][^>]*>([\s\S]*?)<\/script>/gi;
          while ((m = moduleRe.exec(html))) {
            const cleaned = m[1].replace(/^\s*import\s+.*?;\s*$/gm, '');
            new Function(cleaned);
          }
          NODE

      - name: Commit e push na branch de auditoria
        run: |
          git config user.name 'github-actions-bot'
          git config user.email 'github-actions-bot@users.noreply.github.com'
          git add index.html
          git commit -m 'Corrige inconsistencias do perfil membro'
          git push origin HEAD:auditoria-membro-v13
