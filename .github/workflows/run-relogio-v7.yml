name: Run Relogio Alertas V7

on:
  push:
    branches: [main]
    paths: ['.github/workflows/run-relogio-v7.yml']

permissions:
  contents: write

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: relogio-alertas-v7
          fetch-depth: 0

      - name: Aplicar relogio e alertas
        run: python scripts/relogio_patch_v7.py

      - name: Validar escopo e JavaScript
        run: |
          git diff --check
          test "$(git diff --name-only | tr '\n' ' ')" = "index.html "
          grep -q 'id="clock-time"' index.html
          grep -q "hora: '19:30'" index.html
          grep -q "nome: 'EBD', hora: '10:00'" index.html
          grep -q "navigator.serviceWorker.register('./sw.js')" index.html
          grep -q "window.dbOnValue = onValue" index.html
          python -c "from pathlib import Path; import re; t=Path('index.html').read_text(encoding='utf-8'); m=re.search(r'<script>\\n  /\\* ===== RELOGIO E ALERTAS V7 ===== \\*/(.*?)</script>', t, re.S); assert m; Path('/tmp/relogio-v7.js').write_text(m.group(1), encoding='utf-8')"
          node --check /tmp/relogio-v7.js
          node --check sw.js

      - name: Commit da versao testada
        run: |
          rm scripts/relogio_patch_v7.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html scripts/relogio_patch_v7.py
          git commit -m 'Adiciona relogio oficial e alertas de culto'
          git push origin HEAD:relogio-alertas-v7
