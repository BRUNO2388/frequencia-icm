name: Run Relogio Alertas V7

on:
  push:
    branches: [main]
    paths: ['.github/workflows/run-relogio-v7.yml']

permissions:
  contents: write

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: relogio-alertas-v7
          fetch-depth: 0

      - name: Aplicar relogio e alertas
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          t = p.read_text(encoding='utf-8')

          css_anchor = "  .dashboard-actions .btn-main { margin-top:0; }\n"
          css_add = """

  .culto-time-panel { display:grid; gap:10px; margin:0 0 14px; }
  .real-clock-line { display:flex; justify-content:space-between; align-items:center; gap:12px; background:var(--card-bg); border:1px solid var(--border-color); border-radius:12px; padding:12px 14px; }
  .real-clock-info { display:flex; flex-direction:column; gap:2px; min-width:0; }
  .real-clock-label { color:var(--secondary); font-size:.75rem; font-weight:900; text-transform:uppercase; letter-spacing:.4px; }
  .real-clock-date { color:var(--text-secondary); font-size:.75rem; text-transform:capitalize; }
  .real-clock-time { color:var(--primary); font-size:1.65rem; line-height:1; font-weight:900; font-variant-numeric:tabular-nums; letter-spacing:1px; white-space:nowrap; }
  .next-service-card { display:grid; gap:3px; background:var(--card-bg); border:1px solid var(--border-color); border-radius:12px; padding:13px 14px; transition:all .2s ease; }
  .next-service-label { color:var(--text-muted); font-size:.68rem; font-weight:900; text-transform:uppercase; letter-spacing:.5px; }
  .next-service-title { color:var(--secondary); font-size:1rem; }
  .next-service-meta { color:var(--text-secondary); font-size:.78rem; text-transform:capitalize; }
  .next-service-countdown { margin-top:5px; color:var(--primary); font-size:.88rem; font-weight:900; }
  .next-service-card.alerta-proximo { background:var(--warning-bg); border-color:var(--warning-border); box-shadow:0 0 0 2px rgba(214,184,92,.12); }
  .next-service-card.alerta-proximo .next-service-countdown { color:var(--warning-text); }
  .next-service-card.em-andamento { background:var(--success-bg); border-color:var(--success-border); }
  .next-service-card.em-andamento .next-service-countdown { color:var(--success-text); }
  .culto-alert-btn { width:100%; margin:0 !important; }
  .culto-alert-btn.ativo { background:var(--success-bg); color:var(--success-text); border-color:var(--success-border); }
"""
          if '/* ===== RELOGIO E ALERTAS V7 ===== */' in t:
              raise SystemExit('Relogio V7 ja aplicado')
          if css_anchor not in t:
              raise SystemExit('Ancora CSS do dashboard nao encontrada')
          t = t.replace(css_anchor, css_anchor + css_add, 1)

          html_anchor = """        <div id=\"dash-status\" class=\"dashboard-status\">⏳ Aguardando dados</div>
      </div>
      <div class=\"dashboard-grid\">"""
          html_new = """        <div id=\"dash-status\" class=\"dashboard-status\">⏳ Aguardando dados</div>
      </div>

      <div class=\"culto-time-panel\">
        <div class=\"real-clock-line\">
          <div class=\"real-clock-info\">
            <span class=\"real-clock-label\">🕒 Hora oficial</span>
            <span id=\"clock-date\" class=\"real-clock-date\">Sincronizando horário...</span>
          </div>
          <strong id=\"clock-time\" class=\"real-clock-time\">--:--:--</strong>
        </div>
        <div id=\"next-service-card\" class=\"next-service-card\">
          <span class=\"next-service-label\">Próximo culto</span>
          <strong id=\"next-service-title\" class=\"next-service-title\">Calculando programação...</strong>
          <span id=\"next-service-meta\" class=\"next-service-meta\"></span>
          <div id=\"next-service-countdown\" class=\"next-service-countdown\">⏳ Aguarde...</div>
        </div>
        <button id=\"btn-alertas-culto\" class=\"btn-small-sec culto-alert-btn\" onclick=\"ativarAlertasCulto()\">🔔 Ativar alertas de culto</button>
      </div>

      <div class=\"dashboard-grid\">"""
          if html_anchor not in t:
              raise SystemExit('Ancora HTML do painel nao encontrada')
          t = t.replace(html_anchor, html_new, 1)

          globals_anchor = "    window.dbRemove = remove;\n"
          globals_new = "    window.dbRemove = remove;\n    window.dbOnValue = onValue;\n    window.dbGet = get;\n"
          if globals_anchor not in t:
              raise SystemExit('Ancora dos globais Firebase nao encontrada')
          t = t.replace(globals_anchor, globals_new, 1)

          sw_pattern = re.compile(r"    if \('serviceWorker' in navigator\) \{\n      const swCode = `.*?navigator\.serviceWorker\.register\(URL\.createObjectURL\(blob\)\)\.catch\(\(\) => \{\}\);\n    \}", re.S)
          sw_new = """    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }"""
          t, n_sw = sw_pattern.subn(sw_new, t, count=1)
          if n_sw != 1:
              raise SystemExit(f'Bloco antigo do service worker nao encontrado: {n_sw}')

          clock_script = r'''

<script>
  /* ===== RELOGIO E ALERTAS V7 ===== */
  (() => {
    const TIME_ZONE = 'America/Sao_Paulo';
    const BRAZIL_OFFSET = '-03:00';
    const ALERTA_ANTES_MS = 5 * 60 * 1000;
    const DURACAO_CULTO_MS = 2 * 60 * 60 * 1000;
    let firebaseServerOffset = 0;
    let tentativaFirebase = 0;

    const fmtHora = new Intl.DateTimeFormat('pt-BR', {
      timeZone: TIME_ZONE,
      hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false
    });
    const fmtData = new Intl.DateTimeFormat('pt-BR', {
      timeZone: TIME_ZONE,
      weekday: 'long', day: '2-digit', month: '2-digit', year: 'numeric'
    });

    function agoraOficial() {
      return new Date(Date.now() + firebaseServerOffset);
    }

    function dataISOEmSaoPaulo(data) {
      const partes = new Intl.DateTimeFormat('en-CA', {
        timeZone: TIME_ZONE, year: 'numeric', month: '2-digit', day: '2-digit'
      }).formatToParts(data);
      const mapa = Object.fromEntries(partes.map(p => [p.type, p.value]));
      return `${mapa.year}-${mapa.month}-${mapa.day}`;
    }

    function adicionarDiasISO(iso, dias) {
      const [ano, mes, dia] = iso.split('-').map(Number);
      const data = new Date(Date.UTC(ano, mes - 1, dia + dias, 12, 0, 0));
      return data.toISOString().slice(0, 10);
    }

    function programacaoDoDia(iso) {
      const diaSemana = new Date(`${iso}T12:00:00${BRAZIL_OFFSET}`).getUTCDay();
      if (diaSemana >= 1 && diaSemana <= 4) {
        return [{ nome: 'Culto da Noite', hora: '19:30' }];
      }
      if (diaSemana === 6) {
        return [{ nome: 'Culto da Noite', hora: '19:00' }];
      }
      if (diaSemana === 0) {
        return [
          { nome: 'EBD', hora: '10:00' },
          { nome: 'Culto da Noite', hora: '19:00' }
        ];
      }
      return [];
    }

    function listarEventos(agora) {
      const hojeISO = dataISOEmSaoPaulo(agora);
      const eventos = [];
      for (let deslocamento = 0; deslocamento <= 8; deslocamento++) {
        const iso = adicionarDiasISO(hojeISO, deslocamento);
        for (const item of programacaoDoDia(iso)) {
          const inicio = new Date(`${iso}T${item.hora}:00${BRAZIL_OFFSET}`);
          eventos.push({ ...item, iso, inicio });
        }
      }
      return eventos.sort((a, b) => a.inicio - b.inicio);
    }

    function obterEventoAtualOuProximo(agora) {
      const agoraMs = agora.getTime();
      const eventos = listarEventos(agora);
      const emAndamento = eventos.find(e => agoraMs >= e.inicio.getTime() && agoraMs < e.inicio.getTime() + DURACAO_CULTO_MS);
      if (emAndamento) return { ...emAndamento, emAndamento: true };
      const proximo = eventos.find(e => e.inicio.getTime() > agoraMs);
      return proximo ? { ...proximo, emAndamento: false } : null;
    }

    function formatarContagem(ms) {
      const totalSeg = Math.max(0, Math.floor(ms / 1000));
      const dias = Math.floor(totalSeg / 86400);
      const horas = Math.floor((totalSeg % 86400) / 3600);
      const minutos = Math.floor((totalSeg % 3600) / 60);
      const segundos = totalSeg % 60;
      if (dias > 0) return `${dias}d ${horas}h ${minutos}min`;
      if (horas > 0) return `${horas}h ${minutos}min ${segundos}s`;
      return `${minutos}min ${String(segundos).padStart(2, '0')}s`;
    }

    function formatarDataEvento(evento) {
      return fmtData.format(new Date(`${evento.iso}T12:00:00${BRAZIL_OFFSET}`));
    }

    function notificacoesAtivas() {
      return 'Notification' in window && Notification.permission === 'granted' && localStorage.getItem('icm_alertas_culto') === '1';
    }

    async function mostrarNotificacao(titulo, corpo, tag) {
      if (!notificacoesAtivas()) return false;
      try {
        if ('serviceWorker' in navigator) {
          const registro = await navigator.serviceWorker.getRegistration();
          if (registro) {
            await registro.showNotification(titulo, {
              body: corpo,
              icon: 'icm.jpg',
              badge: 'icm.jpg',
              tag,
              renotify: false,
              vibrate: [180, 80, 180]
            });
            return true;
          }
        }
        new Notification(titulo, { body: corpo, icon: 'icm.jpg', tag });
        return true;
      } catch (_) {
        return false;
      }
    }

    async function notificarUmaVez(evento, tipo, titulo, corpo) {
      if (!notificacoesAtivas()) return;
      const chave = `icm_alerta_${evento.iso}_${evento.hora.replace(':', '')}_${tipo}`;
      if (localStorage.getItem(chave) === '1') return;
      const mostrou = await mostrarNotificacao(titulo, corpo, chave);
      if (mostrou) localStorage.setItem(chave, '1');
    }

    function atualizarBotaoAlertas() {
      const btn = document.getElementById('btn-alertas-culto');
      if (!btn) return;
      btn.classList.remove('ativo');
      btn.disabled = false;
      if (!('Notification' in window)) {
        btn.textContent = '🔕 Alertas não suportados neste navegador';
        btn.disabled = true;
        return;
      }
      if (Notification.permission === 'denied') {
        btn.textContent = '🔕 Notificações bloqueadas no navegador';
        btn.disabled = true;
        return;
      }
      if (notificacoesAtivas()) {
        btn.textContent = '🔔 Alertas de culto ativados';
        btn.classList.add('ativo');
      } else {
        btn.textContent = '🔔 Ativar alertas de culto';
      }
    }

    async function ativarAlertasCulto() {
      if (!('Notification' in window)) {
        alert('Este navegador não oferece notificações para o app.');
        return;
      }
      if (notificacoesAtivas()) {
        localStorage.setItem('icm_alertas_culto', '0');
        atualizarBotaoAlertas();
        return;
      }
      try {
        const permissao = await Notification.requestPermission();
        if (permissao === 'granted') {
          localStorage.setItem('icm_alertas_culto', '1');
          atualizarBotaoAlertas();
          await mostrarNotificacao('🔔 Alertas ativados', 'Você será avisado 5 minutos antes do início dos cultos enquanto o app estiver aberto.', 'icm-alertas-ativados');
        } else {
          localStorage.setItem('icm_alertas_culto', '0');
          atualizarBotaoAlertas();
        }
      } catch (_) {
        alert('Não foi possível ativar as notificações neste navegador.');
      }
    }

    function atualizarRelogioECulto() {
      const relogio = document.getElementById('clock-time');
      const dataEl = document.getElementById('clock-date');
      const card = document.getElementById('next-service-card');
      const titulo = document.getElementById('next-service-title');
      const meta = document.getElementById('next-service-meta');
      const contagem = document.getElementById('next-service-countdown');
      if (!relogio || !dataEl || !card || !titulo || !meta || !contagem) return;

      const agora = agoraOficial();
      relogio.textContent = fmtHora.format(agora);
      dataEl.textContent = fmtData.format(agora);

      const evento = obterEventoAtualOuProximo(agora);
      card.classList.remove('alerta-proximo', 'em-andamento');
      if (!evento) {
        titulo.textContent = 'Sem culto programado';
        meta.textContent = '';
        contagem.textContent = 'Confira a programação da igreja.';
        return;
      }

      titulo.textContent = `${evento.nome} — ${evento.hora}`;
      meta.textContent = formatarDataEvento(evento);
      const diferenca = evento.inicio.getTime() - agora.getTime();

      if (evento.emAndamento) {
        card.classList.add('em-andamento');
        const minutos = Math.floor(Math.max(0, -diferenca) / 60000);
        contagem.textContent = minutos < 1 ? '🙏 Culto iniciando agora' : `🙏 Culto em andamento há ${minutos} min`;
        if (-diferenca >= 0 && -diferenca < 60000) {
          notificarUmaVez(evento, 'inicio', '🙏 Culto iniciando agora', `${evento.nome} está começando neste momento.`);
        }
        return;
      }

      contagem.textContent = `⏳ Faltam ${formatarContagem(diferenca)}`;
      if (diferenca > 0 && diferenca <= ALERTA_ANTES_MS) {
        card.classList.add('alerta-proximo');
        contagem.textContent = `🔔 Começa em ${formatarContagem(diferenca)}`;
        notificarUmaVez(evento, '5min', '🔔 Culto em 5 minutos', `${evento.nome} começa às ${evento.hora}.`);
      }
    }

    function sincronizarHoraFirebase() {
      if (window.db && window.dbRef && window.dbOnValue) {
        try {
          window.dbOnValue(window.dbRef(window.db, '.info/serverTimeOffset'), (snapshot) => {
            const valor = Number(snapshot.val());
            firebaseServerOffset = Number.isFinite(valor) ? valor : 0;
          });
          return;
        } catch (_) {}
      }
      tentativaFirebase++;
      if (tentativaFirebase < 12) setTimeout(sincronizarHoraFirebase, 500);
    }

    function iniciarRelogioCultos() {
      atualizarBotaoAlertas();
      atualizarRelogioECulto();
      sincronizarHoraFirebase();
      setInterval(atualizarRelogioECulto, 1000);
    }

    window.ativarAlertasCulto = ativarAlertasCulto;

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', iniciarRelogioCultos, { once: true });
    } else {
      iniciarRelogioCultos();
    }
  })();
</script>
'''
          if '</body>' not in t:
              raise SystemExit('Fechamento body nao encontrado')
          t = t.replace('</body>', clock_script + '\n</body>', 1)
          p.write_text(t, encoding='utf-8')
          PY

      - name: Validar arquivos e JavaScript
        run: |
          git diff --check
          test "$(git diff --name-only | tr '\n' ' ')" = "index.html "
          grep -q 'id="clock-time"' index.html
          grep -q "hora: '19:30'" index.html
          grep -q "nome: 'EBD', hora: '10:00'" index.html
          grep -q "navigator.serviceWorker.register('./sw.js')" index.html
          grep -q "window.dbOnValue = onValue" index.html
          python - <<'PY'
          from pathlib import Path
          import re
          t = Path('index.html').read_text(encoding='utf-8')
          m = re.search(r'<script>\n  /\* ===== RELOGIO E ALERTAS V7 ===== \*/(.*?)</script>', t, re.S)
          if not m:
              raise SystemExit('Script de relogio nao encontrado')
          Path('/tmp/relogio-v7.js').write_text(m.group(1), encoding='utf-8')
          PY
          node --check /tmp/relogio-v7.js
          node --check sw.js

      - name: Commit da versao testada
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Adiciona relogio oficial e alertas de culto'
          git push origin HEAD:relogio-alertas-v7
