name: Run Classes Chamada V8

on:
  push:
    branches: [main]
    paths: ['.github/workflows/run-classes-v8.yml']

permissions:
  contents: write

jobs:
  adjust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: classes-chamada-v8
          fetch-depth: 0

      - name: Adicionar filtros de Intermediarios e Bebes
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          t = p.read_text(encoding='utf-8')

          old = '''        <button class="filter-chip" data-filter="Adolescentes" onclick="setFiltroChamada('Adolescentes', this)">Adolescentes</button>
        <button class="filter-chip" data-filter="Crianças" onclick="setFiltroChamada('Crianças', this)">Crianças</button>'''

          new = '''        <button class="filter-chip" data-filter="Adolescentes" onclick="setFiltroChamada('Adolescentes', this)">Adolescentes</button>
        <button class="filter-chip" data-filter="Intermediários" onclick="setFiltroChamada('Intermediários', this)">Intermediários</button>
        <button class="filter-chip" data-filter="Crianças" onclick="setFiltroChamada('Crianças', this)">Crianças</button>
        <button class="filter-chip" data-filter="Bebês" onclick="setFiltroChamada('Bebês', this)">Bebês</button>'''

          if old not in t:
              raise SystemExit('Trecho esperado dos filtros nao encontrado')
          if 'data-filter="Intermediários"' in t or 'data-filter="Bebês"' in t:
              raise SystemExit('Filtros novos ja existem')

          t = t.replace(old, new, 1)
          p.write_text(t, encoding='utf-8')
          PY

      - name: Validar ajuste
        run: |
          git diff --check
          test "$(git diff --name-only | tr '\n' ' ')" = "index.html "
          grep -q 'data-filter="Intermediários"' index.html
          grep -q 'data-filter="Bebês"' index.html
          grep -q 'filter-chip active.*PRESENTES' index.html
          ! grep -q 'data-filter="TODOS"' index.html
          ! grep -q 'data-filter="AUSENTES"' index.html
          grep -q '"Intermediários", "Crianças", "Bebês"' index.html

      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Adiciona Intermediarios e Bebes aos filtros da chamada'
          git push origin HEAD:classes-chamada-v8
