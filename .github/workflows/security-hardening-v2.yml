name: Security Hardening V2

on:
  push:
    branches: [security-hardening-v2]
    paths:
      - scripts/security_v2.patch.gz.b64

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply hardened patch
        run: |
          base64 -d scripts/security_v2.patch.gz.b64 | gzip -d > /tmp/security_v2.patch
          git apply --check /tmp/security_v2.patch
          git apply /tmp/security_v2.patch

      - name: Validate JavaScript syntax
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script([^>]*)>(.*?)</script>', html, flags=re.S | re.I)
          n = 0
          for attrs, body in scripts:
              if 'src=' in attrs.lower(): continue
              ext = '.mjs' if 'type="module"' in attrs.lower() else '.js'
              Path(f'/tmp/app_{n}{ext}').write_text(body, encoding='utf-8')
              n += 1
          PY
          for f in /tmp/app_*; do node --check "$f"; done

      - name: Verify hardening markers
        run: |
          grep -q "cultos_app/atual" index.html
          grep -q "getAllKeys" index.html
          grep -q "escapeHTML" index.html
          grep -q "csvCampoSeguro" index.html
          ! grep -q "onValue(ref(db, 'cultos_app')" index.html

      - name: Commit hardened index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Reforça privacidade, XSS e sincronização offline"
          git push
