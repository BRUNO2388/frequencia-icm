name: Run Grupo Louvor V15

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-grupo-louvor-v15.yml'

permissions:
  contents: write

jobs:
  patch-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grupo-louvor-v15
          fetch-depth: 0

      - name: Aplicar integração do Grupo de Louvor
        run: python tools/patch_grupo_louvor_v15.py

      - name: Validar arquivos alterados
        run: |
          git diff --check
          printf '%s\n' "$(git diff --name-only)" | sort > /tmp/changed.txt
          printf 'database.rules.json\nindex.html\n' > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/changed.txt

      - name: Validar módulo e segurança
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          s = Path('index.html').read_text(encoding='utf-8')
          checks = [
              'data-tab="louvor"',
              'id="tab-louvor"',
              'Grupo de Louvor',
              "window.dbRef(window.db, 'membros_louvor')",
              "window.dbRef(window.db, 'registros_louvor')",
              'function glSalvarChamada()',
              'function glCadastrarIntegrante()',
              'function glRenderHistorico()',
              "nomeAba === 'louvor'",
              'window.iniciarGrupoLouvorAdmin?.()'
          ]
          for item in checks:
              assert item in s, item
          bloco = s.split('<!-- MÓDULO ADMINISTRATIVO: GRUPO DE LOUVOR -->', 1)[1].split('<!-- ABA 3: RELATÓRIO MENSAL -->', 1)[0]
          assert 'Repertório' not in bloco and 'repertório' not in bloco
          rules = json.loads(Path('database.rules.json').read_text(encoding='utf-8'))['rules']
          admin = "auth != null && auth.token.email == 'icmpinhos@gmail.com'"
          assert rules['membros_louvor']['.read'] == admin
          assert rules['membros_louvor']['.write'] == admin
          assert rules['registros_louvor']['.read'] == admin
          assert rules['registros_louvor']['.write'] == admin
          assert rules['cultos_app']['membros']['.read'] == 'auth != null'
          PY

      - name: Validar JavaScript
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const classic = /<script(?![^>]*\bsrc=)(?![^>]*\btype=["']module["'])[^>]*>([\s\S]*?)<\/script>/gi;
          let m, count = 0;
          while ((m = classic.exec(html))) {
            count++;
            new Function(m[1]);
          }
          if (!count) throw new Error('Nenhum script clássico encontrado');
          const moduleRe = /<script[^>]*\btype=["']module["'][^>]*>([\s\S]*?)<\/script>/gi;
          while ((m = moduleRe.exec(html))) {
            const cleaned = m[1].replace(/^\s*import\s+.*?;\s*$/gm, '');
            new Function(cleaned);
          }
          NODE

      - name: Commit e push na branch de teste
        run: |
          git config user.name 'github-actions-bot'
          git config user.email 'github-actions-bot@users.noreply.github.com'
          git add index.html database.rules.json
          git commit -m 'Integra Grupo de Louvor ao app de frequencia'
          git push origin HEAD:grupo-louvor-v15
