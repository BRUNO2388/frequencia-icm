name: Run Limpar Chamada GL V16

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-limpar-chamada-gl-v16.yml'

permissions:
  contents: write

jobs:
  patch-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: limpar-chamada-gl-v16
          fetch-depth: 0

      - name: Aplicar correção da limpeza do GL
        run: python tools/patch_limpar_chamada_gl_v16.py

      - name: Validar alteração
        run: |
          git diff --check
          test "$(git diff --name-only)" = "index.html"
          grep -q "🗑️ Limpar chamada" index.html
          grep -q "async function glLimparMarcacoes()" index.html
          grep -q "registros_louvor/\${data}" index.html
          grep -q "Chamada de \${glFormatarData(data)} apagada" index.html
          node - <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const classic = /<script(?![^>]*\bsrc=)(?![^>]*\btype=["']module["'])[^>]*>([\s\S]*?)<\/script>/gi;
          let m, count = 0;
          while ((m = classic.exec(html))) { count++; new Function(m[1]); }
          if (!count) throw new Error('Nenhum script clássico encontrado');
          const moduleRe = /<script[^>]*\btype=["']module["'][^>]*>([\s\S]*?)<\/script>/gi;
          while ((m = moduleRe.exec(html))) {
            const cleaned = m[1].replace(/^\s*import\s+.*?;\s*$/gm, '');
            new Function(cleaned);
          }
          NODE

      - name: Commit e push na branch de teste
        run: |
          git config user.name 'github-actions-bot'
          git config user.email 'github-actions-bot@users.noreply.github.com'
          git add index.html
          git commit -m 'Corrige limpeza de chamada do Grupo de Louvor'
          git push origin HEAD:limpar-chamada-gl-v16
