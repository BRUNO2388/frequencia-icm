name: Run Contador Topo V9

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/run-contador-topo-v9.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: contador-topo-v9
          fetch-depth: 0
      - name: Aplicar ajuste
        run: python tools/patch_contador_topo_v9.py
      - name: Validar diff
        run: git diff --check
      - name: Confirmar somente index
        run: test "$(git diff --name-only | tr '\n' ' ')" = "index.html "
      - name: Commit e push
        run: |
          git config user.name github-actions-bot
          git config user.email github-actions-bot@users.noreply.github.com
          git add index.html
          git commit -m "Move contador da chamada para o topo"
          git push origin HEAD:contador-topo-v9
