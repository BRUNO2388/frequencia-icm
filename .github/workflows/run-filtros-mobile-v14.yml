name: Run Filtros Mobile V14

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-filtros-mobile-v14.yml'

permissions:
  contents: write

jobs:
  patch-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: filtros-mobile-v14
          fetch-depth: 0

      - name: Aplicar ajuste dos filtros mobile
        run: python tools/patch_filtros_mobile_v14.py

      - name: Validar alteração
        run: |
          git diff --check
          test "$(git diff --name-only)" = "index.html"
          grep -q "data-filter=\"Bebês\"" index.html
          grep -q "flex-wrap: wrap;" index.html
          grep -q "overflow-x: visible;" index.html
          node - <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const classic = /<script(?![^>]*\bsrc=)(?![^>]*\btype=["']module["'])[^>]*>([\s\S]*?)<\/script>/gi;
          let m, count = 0;
          while ((m = classic.exec(html))) { count++; new Function(m[1]); }
          if (!count) throw new Error('Nenhum script clássico encontrado');
          const moduleRe = /<script[^>]*\btype=["']module["'][^>]*>([\s\S]*?)<\/script>/gi;
          while ((m = moduleRe.exec(html))) {
            const cleaned = m[1].replace(/^\s*import\s+.*?;\s*$/gm, '');
            new Function(cleaned);
          }
          NODE

      - name: Commit e push na branch de teste
        run: |
          git config user.name 'github-actions-bot'
          git config user.email 'github-actions-bot@users.noreply.github.com'
          git add index.html
          git commit -m 'Ajusta filtros de chamada no mobile'
          git push origin HEAD:filtros-mobile-v14
