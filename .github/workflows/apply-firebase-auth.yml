name: Apply Firebase Auth Patch

on:
  push:
    branches:
      - firebase-auth-segura
    paths:
      - '.github/workflows/apply-firebase-auth.yml'
      - 'scripts/apply_auth_patch.py'

permissions:
  contents: write

jobs:
  apply-auth:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply authentication patch
        run: python scripts/apply_auth_patch.py

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import subprocess
          import tempfile

          html = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s+type="module")?>(.*?)</script>', html, flags=re.S)
          if not scripts:
              raise SystemExit('Nenhum script interno encontrado para validar.')
          for i, script in enumerate(scripts):
              if not script.strip():
                  continue
              with tempfile.NamedTemporaryFile('w', suffix='.js', encoding='utf-8', delete=False) as f:
                  f.write(script)
                  name = f.name
              subprocess.run(['node', '--check', name], check=True)
          print('JavaScript validado com sucesso.')
          PY

      - name: Commit secure index
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "Nenhuma alteração necessária."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Aplica autenticação Firebase e perfis admin/membro"
          git push
